<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 非遗基因解码者</title>
    <style>
        /* 使用与主页面相同的样式，添加个人中心特有样式 */
        .user-profile {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            background-color: #3498db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-right: 20px;
        }
        
        .profile-info h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .profile-info p {
            color: #7f8c8d;
        }
        
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .profile-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 8px 16px;
            background: #ecf0f1;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .action-btn:hover {
            background: #d5dbdb;
        }
    </style>
</head>
<body>
    <!-- 使用与主页面相同的导航栏 -->
    <header>
        <div class="container">
            <nav class="navbar">
                <div class="logo">非遗<span>基因解码者</span></div>
                <ul class="nav-links">
                    <li><a href="index.html">首页</a></li>
                    <li><a href="intelligent-qa.html">智能问答</a></li>
                    <li><a href="ai-creation.html">AI创作</a></li>
                    <li><a href="booking.html">预约体验</a></li>
                    <li><a href="about.html">关于我们</a></li>
                </ul>
                <div class="user-center">
                    <div id="user-info" style="display: none;">
                        <span id="welcome-message" style="margin-right: 10px;"></span>
                        <button onclick="logout()" class="btn" style="padding: 5px 10px; font-size: 14px;">退出</button>
                    </div>
                    <div id="login-btn">
                        <a href="login.html" class="btn" style="padding: 5px 10px; font-size: 14px;">登录/注册</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" style="padding: 40px 0;">
            <div class="container">
                <h1>个人中心</h1>
                <p>管理您的个人信息和活动记录</p>
            </div>
        </section>

        <div class="container">
            <div class="user-profile">
                <div class="profile-header">
                    <div class="avatar" id="user-avatar">用户</div>
                    <div class="profile-info">
                        <h2 id="profile-username">用户名</h2>
                        <p id="profile-email">邮箱</p>
                        <p>注册时间: <span id="profile-join-date"></span></p>
                    </div>
                </div>
                
                <div class="profile-stats">
                    <div class="stat-card">
                        <div class="stat-number" id="qa-count">0</div>
                        <div class="stat-label">智能问答次数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="creation-count">0</div>
                        <div class="stat-label">AI创作作品</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="booking-count">0</div>
                        <div class="stat-label">预约体验</div>
                    </div>
                </div>
                
                <div class="profile-actions">
                    <button class="action-btn" onclick="editProfile()">编辑资料</button>
                    <button class="action-btn" onclick="viewHistory()">查看历史记录</button>
                    <button class="action-btn" onclick="changePassword()">修改密码</button>
                    <button class="action-btn" onclick="logout()">退出登录</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 使用与主页面相同的页脚 -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="logo" style="color: white;">非遗<span style="color: #3498db;">基因解码者</span></div>
                <ul class="footer-links">
                    <li><a href="index.html">首页</a></li>
                    <li><a href="intelligent-qa.html">智能问答</a></li>
                    <li><a href="ai-creation.html">AI创作</a></li>
                    <li><a href="booking.html">预约体验</a></li>
                    <li><a href="about.html">关于我们</a></li>
                    <li><a href="contact.html">联系我们</a></li>
                </ul>
                <p class="copyright">© 2025 非遗基因解码者：基于大模型的个性定制平台 版权所有</p>
            </div>
        </div>
    </footer>

    <script>
        // 检查登录状态并加载用户信息
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const userInfo = document.getElementById('user-info');
            const loginBtn = document.getElementById('login-btn');
            const welcomeMessage = document.getElementById('welcome-message');
            
            if (currentUser) {
                // 显示用户信息
                document.getElementById('profile-username').textContent = currentUser.username;
                document.getElementById('profile-email').textContent = currentUser.email;
                document.getElementById('user-avatar').textContent = currentUser.username.charAt(0);
                
                if (currentUser.joinDate) {
                    const joinDate = new Date(currentUser.joinDate);
                    document.getElementById('profile-join-date').textContent = joinDate.toLocaleDateString();
                }
                
                // 更新导航栏
                welcomeMessage.textContent = `欢迎，${currentUser.username}`;
                userInfo.style.display = 'block';
                loginBtn.style.display = 'none';
                
                // 加载用户统计数据
                loadUserStats();
            } else {
                // 未登录，跳转到登录页面
                window.location.href = 'login.html';
            }
        });
        
        function loadUserStats() {
            // 这里可以从localStorage或其他地方加载用户统计数据
            // 示例数据
            document.getElementById('qa-count').textContent = '12';
            document.getElementById('creation-count').textContent = '5';
            document.getElementById('booking-count').textContent = '3';
        }
        
        function editProfile() {
            alert('编辑资料功能正在开发中');
        }
        
        function viewHistory() {
            alert('查看历史记录功能正在开发中');
        }
        
        function changePassword() {
            alert('修改密码功能正在开发中');
        }
        
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
